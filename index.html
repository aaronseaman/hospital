<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140c1c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hosp. Fighter">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="HOSPITAL FIGHTER: an 8-bit fighting game parody where overworked hospital staff battle for budget, beds and the last clean ultrasound probe.">
<meta property="og:title" content="Hospital Fighter">
<meta property="og:description" content="Overworked hospital staff fight for budget, beds and the last clean ultrasound probe. Scrub in!">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Hospital Fighter</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  canvas#game { position: absolute; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
  #crt { position: absolute; pointer-events: none; display: none;
    background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 62%, rgba(0,0,0,0.28) 62%, rgba(0,0,0,0.28) 100%);
    box-shadow: inset 0 0 80px rgba(0,0,0,0.55); }
  #safe { position: absolute; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffd040;
    font: bold 16px/1.4 monospace; letter-spacing: 2px; text-align: center; }
</style>
</head>
<body>
<div id="safe"></div>
<div id="boot">HOSPITAL FIGHTER<br>SCRUBBING IN...</div>
<canvas id="game" width="384" height="216" aria-label="Hospital Fighter game screen" tabindex="0"></canvas>
<div id="crt"></div>
<noscript><p style="color:#fff;font-family:monospace;text-align:center;margin-top:30vh">HOSPITAL FIGHTER needs JavaScript. Please enable it (it's medically necessary).</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
