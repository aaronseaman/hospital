<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { LOOKS, lookFor } from '../src/looks.js';
import { POSES } from '../src/poses.js';
import { drawFighterSprite, getPortrait } from '../src/sprites.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'roster';
const S = +(q.get('s') || 3);
const c = document.getElementById('c'); const g = c.getContext('2d');
if (mode === 'roster') {
  const ids = Object.keys(LOOKS);
  const pose = q.get('pose') || 'idle1';
  const W = 6 * 70, H = 3 * 100 + 40;
  c.width = W; c.height = H; c.style.width = W*S+'px'; c.style.height = H*S+'px';
  g.fillStyle = '#5a6a7a'; g.fillRect(0,0,W,H);
  ids.forEach((id, i) => {
    const x = (i % 6) * 70 + 35, y = Math.floor(i / 6) * 100 + 92;
    g.fillStyle = '#4a5a6a'; g.fillRect(x-30, y, 60, 2);
    drawFighterSprite(g, lookFor(id, q.get('alt')==='1'), pose, x, y, 1, q.get('v')||'');
  });
} else if (mode === 'poses') {
  const id = q.get('id') || 'trauma';
  const names = Object.keys(POSES);
  const cols = 10, cw = 90, ch = 100;
  const W = cols * cw, H = Math.ceil(names.length / cols) * ch;
  c.width = W; c.height = H; c.style.width = W*S+'px'; c.style.height = H*S+'px';
  g.fillStyle = '#5a6a7a'; g.fillRect(0,0,W,H);
  names.forEach((n, i) => {
    const x = (i % cols) * cw + cw/2, y = Math.floor(i / cols) * ch + ch - 8;
    g.fillStyle = '#4a5a6a'; g.fillRect(x-40, y, 80, 1);
    drawFighterSprite(g, lookFor(id), n, x, y, 1, q.get('v')||'');
    g.fillStyle = '#fff'; g.font = '7px monospace'; g.fillText(n, x-40, y+7);
  });
} else if (mode === 'props') {
  const list = [['janitor','slide','mop'],['janitor','win1','mop'],['chaplain','pray','book'],['psych','stance','notepad'],['pharmacist','lobW','bottle'],['labtech','stretchA','tube'],['dietitian','introA','carrot'],['it','tauntB','mug'],['admin','introA','briefcase'],['trauma','superFlash','paddles'],['trauma','projA','syringe'],['trauma','impactA','clipboard']];
  const W = 6 * 80, H = 2 * 100; c.width = W; c.height = H; c.style.width = W*S+'px'; c.style.height = H*S+'px';
  g.fillStyle = '#5a6a7a'; g.fillRect(0,0,W,H);
  list.forEach(([id,pose,prop], i) => drawFighterSprite(g, lookFor(id), pose, (i%6)*80+40, Math.floor(i/6)*100+92, 1, '', prop));
} else if (mode === 'portraits') {
  const ids = Object.keys(LOOKS);
  const W = 6*36, H = 3*36; c.width=W; c.height=H; c.style.width=W*S+'px'; c.style.height=H*S+'px';
  g.fillStyle='#202040'; g.fillRect(0,0,W,H);
  ids.forEach((id,i)=>{ g.drawImage(getPortrait(lookFor(id), 'idle1', 32, 32), (i%6)*36+2, Math.floor(i/6)*36+2); });
}
window.done = true;
</script></body></html>
